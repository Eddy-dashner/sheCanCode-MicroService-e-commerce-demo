server:
  port: 8083

spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:5432/inventory_db
    username: ${POSTGRES_USER:shop}
    password: ${POSTGRES_PASSWORD:shop}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      # JSON on the wire; the serializer stamps a type header so the consumer
      # knows which event class to rebuild.
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: inventory-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        # Only deserialize classes from our own contract package — never trust
        # arbitrary types off the wire (a security + safety guard).
        spring.json.trusted.packages: com.shop.events
    listener:
      # Manual/record ack is fine; default is BATCH. We keep the default and rely
      # on the idempotency ledger for at-least-once safety.
      ack-mode: RECORD

# The whole system starts with `docker compose up`. Phase 1 brings up the
# shared infrastructure plus the data/messaging backbone that later services need.
services:

  # --- Data + messaging backbone (no business logic yet, but proven running) ---

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
    ports:
      - "5432:5432"
    volumes:
      # Creates one database per service on first boot — enforces "no shared DB".
      - ./infra/postgres/init:/docker-entrypoint-initdb.d
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    # Apache Kafka in KRaft mode: single image, no ZooKeeper. Simplest local setup.
    image: apache/kafka:3.8.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # --- Shared platform services ---

  config-server:
    build:
      context: .
      args:
        MODULE: config-server
    ports:
      - "8888:8888"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8888/actuator/health | grep -q UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  discovery-server:
    build:
      context: .
      args:
        MODULE: discovery-server
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
    ports:
      - "8761:8761"
    depends_on:
      config-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8761/actuator/health | grep -q UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  api-gateway:
    build:
      context: .
      args:
        MODULE: api-gateway
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_HOST: discovery-server
    ports:
      - "8080:8080"
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy

  # --- Business services (added one per phase) ---

  user-service:
    build:
      context: .
      args:
        MODULE: user-service
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_HOST: discovery-server
      POSTGRES_HOST: postgres
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
      # Provided at runtime, never committed. Falls back to the dev placeholder.
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-secret-change-me-min-32-bytes-long!!}
    ports:
      - "8081:8081"
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      postgres:
        condition: service_healthy

  product-service:
    build:
      context: .
      args:
        MODULE: product-service
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_HOST: discovery-server
      POSTGRES_HOST: postgres
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
    ports:
      - "8082:8082"
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      postgres:
        condition: service_healthy

  inventory-service:
    build:
      context: .
      args:
        MODULE: inventory-service
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_HOST: discovery-server
      POSTGRES_HOST: postgres
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
      KAFKA_BOOTSTRAP: kafka:9092
    ports:
      - "8083:8083"
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  order-service:
    build:
      context: .
      args:
        MODULE: order-service
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_HOST: discovery-server
      POSTGRES_HOST: postgres
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
      KAFKA_BOOTSTRAP: kafka:9092
    ports:
      - "8084:8084"
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

volumes:
  postgres-data:
